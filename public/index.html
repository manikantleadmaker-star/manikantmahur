<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>High Deliverability Mailer Engine</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
    .hidden { display: none !important; }
    .container { max-width: 900px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); position: relative; }
    h2 { color: #38bdf8; font-size: 22px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
    .full-width { grid-column: span 2; }
    label { font-size: 13px; color: #94a3b8; display: block; margin-bottom: 5px; }
    .input-wrap { position: relative; }
    input, textarea { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 14px; }
    .toggle-pass { position: absolute; right: 10px; top: 10px; cursor: pointer; color: #94a3b8; }
    input:focus, textarea:focus { outline: none; border-color: #38bdf8; }
    textarea { resize: vertical; }
    .btn-group { display: flex; gap: 10px; margin-top: 15px; }
    button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-send { background: #10b981; color: #fff; }
    .btn-stop { background: #ef4444; color: #fff; }
    .btn-logout { background: transparent; border: 1px solid #ef4444; color: #ef4444; padding: 6px 12px; font-size: 12px; }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .stats { display: flex; justify-content: space-between; background: #0f172a; padding: 12px; border-radius: 6px; margin: 15px 0; font-size: 14px; }
    .stats span { font-weight: bold; }
    .stat-sent, .text-success { color: #10b981; }
    .stat-failed, .text-danger { color: #ef4444; }
    .text-warning { color: #f59e0b; }
    .text-primary { color: #3b82f6; }
    .progress-container { width: 100%; background: #0f172a; height: 8px; border-radius: 4px; overflow: hidden; margin-bottom: 15px; }
    .progress-bar { width: 0%; height: 100%; background: #10b981; transition: width 0.3s; }
    .error-msg { color: #f87171; font-size: 12px; margin-top: 5px; }
    .status-box { font-size: 13px; margin: 10px 0; display: flex; align-items: center; gap: 8px; }
    .btn-shake { animation: shake 0.4s; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  </style>
</head>
<body>

  <!-- PASSWORD GATE -->
  <div id="password-gate" class="container" style="max-width: 400px; margin-top: 80px;">
    <h2><i class="fa-solid fa-lock"></i> System Access</h2>
    <form id="gate-form" style="margin-top: 15px;">
      <label>Enter Site Password</label>
      <div class="input-wrap">
        <input type="password" id="gate-password" placeholder="Password Required">
        <span class="toggle-pass" id="toggle-gate-password"><i class="fa-regular fa-eye"></i></span>
      </div>
      <div id="gate-error" class="error-msg hidden"><span>Invalid Password. Try again.</span></div>
      <button type="submit" id="gate-submit-btn" class="btn-primary" style="width:100%; margin-top:15px;">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Enter
      </button>
    </form>
  </div>

  <!-- MAIN APP -->
  <div id="main-app" class="container hidden">
    <div class="header">
      <h2>🚀 Mailer Inbox Engine</h2>
      <button id="logout-btn" class="btn-logout" title="Double click to logout">Logout</button>
    </div>

    <div class="grid">
      <div>
        <label>Sender Gmail Address</label>
        <input type="email" id="dashboard-email" placeholder="example@gmail.com">
      </div>
      <div>
        <label>Gmail App Password (16-Digit)</label>
        <div class="input-wrap">
          <input type="password" id="dashboard-password" placeholder="xxxx xxxx xxxx xxxx">
          <span class="toggle-pass" id="toggle-password"><i class="fa-regular fa-eye"></i></span>
        </div>
      </div>
      <div>
        <label>Sender Name</label>
        <input type="text" id="sender-name" placeholder="John Doe">
      </div>
      <div>
        <label>Subject (Supports Spintax & Tags)</label>
        <input type="text" id="subject" placeholder="{Hello|Hi} {Name}, important update">
      </div>
      <div class="full-width">
        <label>Email Body (Supports HTML or Plain Text)</label>
        <textarea id="message-body" rows="4" placeholder="{Hi|Hey} {Name},&#10;&#10;Here is your update for {Domain}."></textarea>
      </div>
      <div class="full-width">
        <div style="display:flex; justify-content:space-between;">
          <label>Recipients List (One per line)</label>
          <span id="detected-count" style="font-size:12px; color:#38bdf8;">0 found</span>
        </div>
        <textarea id="recipients-input" rows="4" placeholder="alex@gmail.com&#10;John,john@example.com"></textarea>
        <div id="email-validation-error" class="error-msg hidden">Please enter valid recipient emails.</div>
      </div>
    </div>

    <!-- Turnstile -->
    <div class="cf-turnstile" data-sitekey="1x0000000000000000000000"></div>

    <div class="status-box">
      <i id="status-icon" class="fa-solid fa-circle-check text-success"></i>
      <span id="status-text">System ready</span>
    </div>

    <div class="progress-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="btn-group">
      <button class="btn-send" id="send-btn"><i class="fa-solid fa-paper-plane"></i> Send All</button>
      <button class="btn-stop hidden" id="stop-btn"><i class="fa-solid fa-stop"></i> Stop Process</button>
    </div>

    <div class="stats">
      <div>Total: <span id="stat-total">0</span></div>
      <div>Sent: <span id="stat-sent" class="stat-sent">0</span></div>
      <div>Failed: <span id="stat-failed" class="stat-failed">0</span></div>
      <div>Remaining: <span id="stat-remaining">0</span></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
